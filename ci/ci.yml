name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: git version (merge-tree --write-tree needs 2.38+)
        run: git --version
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked

  build:
    name: static Linux binaries
    needs: [test, msrv]
    runs-on: ubuntu-24.04
    env:
      # Pure-Rust crates only, so the Rust linker is enough for musl.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 ci/check-release-version.py "$GITHUB_REF_NAME"
      - run: bash ci/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: medic-linux
          path: dist/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medic-linux
          path: dist
      - name: Check publication tools
        run: gh --version
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
