[package]
name = "medic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Git-only PR triage: file overlap, real merge conflicts and merge-risk scoring."
license = "MIT"
publish = false

[[bin]]
name = "medic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
